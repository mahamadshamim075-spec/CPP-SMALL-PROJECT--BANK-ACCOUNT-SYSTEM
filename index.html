<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Account System</title>
<style>
  :root {
    --body:#2b3038; --bezel:#14171c; --screen-top:#0f4c81; --screen-bot:#0a2f55;
    --text:#eaf4ff; --soft:#9cc3e6; --line:rgba(255,255,255,.18);
    --key:#e8b93c; --key-text:#2a2100; --err:#ffb4a9; --ok:#a8f0c2;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px 12px; background:#e9edf2; font-family:"Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background:#0c0f13; } }

  .atm { width:100%; max-width:560px; background:var(--body); border-radius:22px; padding:22px; box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .brand { display:flex; justify-content:space-between; align-items:center; color:#cfd6df; font-weight:600; letter-spacing:.04em; margin:0 4px 14px; }
  .slot { width:90px; height:8px; border-radius:4px; background:#0b0d10; }

  .bezel { background:var(--bezel); border-radius:14px; padding:14px; }
  .screen {
    min-height:390px; border-radius:8px; padding:26px 24px 22px; color:var(--text);
    background:linear-gradient(180deg,var(--screen-top),var(--screen-bot));
    box-shadow:inset 0 0 40px rgba(0,0,0,.45);
  }
  .screen > section { display:none; }
  .screen > section.active { display:block; }

  h1 { font-size:1.4rem; font-weight:600; margin:0 0 6px; }
  .sub { color:var(--soft); margin:0 0 22px; font-size:1rem; }

  /* Menu: two columns like ATM side buttons */
  .options { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt {
    display:flex; align-items:center; gap:12px; width:100%; padding:14px 12px;
    background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:1.02rem; text-align:left; cursor:pointer;
  }
  .opt:hover { background:rgba(255,255,255,.14); }
  .opt .n {
    flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
    background:var(--key); color:var(--key-text); font-weight:700; font-size:.9rem;
  }

  /* Amount screens */
  input {
    width:100%; padding:14px; font-size:1.6rem; text-align:center; color:var(--text);
    background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:8px;
  }
  input::placeholder { color:var(--soft); opacity:.6; }
  .actions { display:flex; gap:12px; margin-top:20px; }
  .btn {
    flex:1; padding:13px; font-size:1.02rem; font-weight:600; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--text);
  }
  .btn.primary { background:var(--key); border-color:var(--key); color:var(--key-text); }
  .btn:hover { filter:brightness(1.1); }
  .opt:focus-visible, .btn:focus-visible, input:focus-visible { outline:3px solid #fff; outline-offset:2px; }

  .amount { font-size:2.6rem; font-weight:600; margin:10px 0 26px; }
  .msg { min-height:1.5em; margin:14px 0 0; text-align:center; color:var(--ok); }
  .msg.error { color:var(--err); }

  ul { list-style:none; padding:0; margin:0 0 14px; max-height:210px; overflow-y:auto; }
  li { padding:9px 2px; border-bottom:1px solid var(--line); }
  .closing { font-weight:600; margin:0; }
</style>
</head>
<body>
<div class="atm">
  <div class="brand"><span>MY BANK ATM</span><span class="slot" aria-hidden="true"></span></div>
  <div class="bezel"><div class="screen">

    <!-- Menu -->
    <section class="active" id="menu">
      <h1>Welcome</h1>
      <p class="sub">What would you like to do?</p>
      <div class="options">
        <button class="opt" data-go="balance"><span class="n">1</span>Check balance</button>
        <button class="opt" data-go="deposit"><span class="n">2</span>Deposit money</button>
        <button class="opt" data-go="withdraw"><span class="n">3</span>Withdraw money</button>
        <button class="opt" data-go="statement"><span class="n">4</span>Print statement</button>
        <button class="opt" data-go="exit"><span class="n">5</span>Exit</button>
      </div>
    </section>

    <!-- Check balance -->
    <section id="balance">
      <h1>Your bank balance is</h1>
      <p class="amount" id="balanceValue"></p>
      <div class="actions"><button class="btn" data-go="menu">Back to menu</button></div>
    </section>

    <!-- Deposit -->
    <section id="deposit">
      <h1>Deposit money</h1>
      <p class="sub">Enter deposit amount</p>
      <input id="depositAmount" type="number" min="0" step="0.01" placeholder="0.00" aria-label="Deposit amount">
      <p class="msg" id="depositMsg" role="status"></p>
      <div class="actions">
        <button class="btn" data-go="menu">Back to menu</button>
        <button class="btn primary" id="depositBtn">Deposit</button>
      </div>
    </section>

    <!-- Withdraw -->
    <section id="withdraw">
      <h1>Withdraw money</h1>
      <p class="sub">Enter withdraw amount</p>
      <input id="withdrawAmount" type="number" min="0" step="0.01" placeholder="0.00" aria-label="Withdraw amount">
      <p class="msg" id="withdrawMsg" role="status"></p>
      <div class="actions">
        <button class="btn" data-go="menu">Back to menu</button>
        <button class="btn primary" id="withdrawBtn">Withdraw</button>
      </div>
    </section>

    <!-- Statement -->
    <section id="statement">
      <h1>Bank statement</h1>
      <p class="sub">Your recent transactions</p>
      <ul id="historyList"></ul>
      <p class="closing" id="closing"></p>
      <div class="actions"><button class="btn" data-go="menu">Back to menu</button></div>
    </section>

    <!-- Exit -->
    <section id="exit">
      <h1>Thank you for using bank account system</h1>
      <div class="actions"><button class="btn" data-go="menu">Start again</button></div>
    </section>

  </div></div>
</div>

<script>
  let balance = 1000.00;
  const history = ["Account opened with : " + balance.toFixed(6)];
  const $ = id => document.getElementById(id);

  function show(name) {
    document.querySelectorAll(".screen > section").forEach(s => s.classList.remove("active"));
    $(name).classList.add("active");
    if (name === "balance") $("balanceValue").textContent = balance.toFixed(2);
    if (name === "statement") {
      $("historyList").innerHTML = "";
      history.forEach(h => { const li = document.createElement("li"); li.textContent = h; $("historyList").appendChild(li); });
      $("closing").textContent = "Closing balance : " + balance.toFixed(2);
    }
    if (name === "deposit" || name === "withdraw") {
      $(name + "Amount").value = "";
      $(name + "Msg").textContent = "";
      $(name + "Amount").focus();
    }
  }

  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => show(b.dataset.go));

  function say(id, text, isError) {
    $(id).textContent = text;
    $(id).className = "msg" + (isError ? " error" : "");
  }

  $("depositBtn").onclick = () => {
    const a = parseFloat($("depositAmount").value);
    if (isNaN(a) || a <= 0) return say("depositMsg", "Please enter amount more than zero(0)", true);
    balance += a;
    history.push("deposited : " + a.toFixed(6));
    say("depositMsg", a + " deposited successfully in your bank account");
    $("depositAmount").value = "";
  };

  $("withdrawBtn").onclick = () => {
    const a = parseFloat($("withdrawAmount").value);
    if (isNaN(a) || a <= 0) return say("withdrawMsg", "Please enter amount more than zero(0)", true);
    if (a > balance) return say("withdrawMsg", "Amount is greater than available balance", true);
    balance -= a;
    history.push("withdraw : " + a.toFixed(6));
    say("withdrawMsg", a + " withdrawn successfully from your bank account");
    $("withdrawAmount").value = "";
  };
</script>
</body>
</html>
